      string: '{"ocs":{"meta":{"status":"ok","statuscode":100,"message":"OK","totalitems":"","itemsperpage":""},"data":{"id":"files_external","name":"External
        storage support","summary":"Adds basic external storage support","description":"This
        application enables administrators to configure connections to external storage
        providers, such as FTP servers, S3 or SWIFT object stores, other Nextcloud
        servers, WebDAV servers, and more. Administration can choose which types of
        storage to enable and can mount these storage locations for an account, a
        group, or the entire system. Users will see a new folder appear in their root
        Nextcloud directory, which they can access and use like any other Nextcloud
        folder. External storage also allows people to share files stored in these
        external locations. In these cases, the credentials for the owner of the file
        are used when the recipient requests the file from external storage, thereby
        ensuring that the recipient can access the shared file.\n\nExternal storage
        can be configured using the GUI or at the command line. This second option
        provides the administration with more flexibility for configuring bulk external
        storage mounts and setting mount priorities. More information is available
        in the external storage GUI documentation and the external storage Configuration
        File documentation.","version":"1.22.0","licence":"agpl","author":["Robin
