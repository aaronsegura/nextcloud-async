[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nextcloud_async"
version = "0.1.0b0"
authors = [
  { name="Aaron Segura" },
]
description = "Asynchronous client library for Nextcloud"
readme = "README.md"
license = { text="License :: OSI Approved :: GNU General Public License v3 (GPLv3)" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Framework :: Pytest",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed"]

keywords = ["nextcloud", "asynchronous", "spreed"]

dependencies = [
  "httpx>=0.28,<1",
  "xmltodict>=0.14,<1",
  "platformdirs>=4.3,<5",
  "typing-extensions>=4.12,<5",
  "aiofile>=3.9.0,<4",
  "python-dateutil>=2.9.0,<3",
]

[project.urls]
"Homepage" = "https://github.com/aaronsegura/nextcloud-async"
"Bug Tracker" = "https://github.com/aaronsegura/nextcloud-async/issues"

[tool.ruff]  # https://docs.astral.sh/ruff/
exclude = [
  "temp.py",
  "build",
  "dist",
  "*.egg-info",
  ]

line-length = 90

[tool.ruff.lint]
select = [
  "D",      # pydocstyle
  "E",      # pycodestyle
  "F",      # pyflakes
  "N",      # pep8-naming
  "ANN",    # flake8-annotations
  "ARG",    # flake8-arguments
  "ASYNC",  # flake8-async
  "COM",    # flake8-comma
  "C4",     # flake8-comprehensions
  "DTZ",    # flake8-datetimez
  "ERA",    # flake8-eradicate
  "FIX",    # flake8-fix
  "ICN",    # flake8-import-conventions
  "PL",     # pylint
  "PT",     # flake8-pytest
  "SLF",    # flake8-self,
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TD",     # flake8-todos
]

ignore = [
  "D100",     # Missing docstring in public module
  "D101",     # Missing docstring in public class
  "D104",     # Missing docstring in public package
  "D105",     # Missing docstring in magic method
  "D107",     # Missing docstring in __init__
  "D203",     # 1 blank line required before class docstring
  "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed
  "TD002",    # Missing author in TODO
  "PLR0913",  # tOo MaNy ArGuMeNtS
  "TD003",    # Missing issue link for Todo
  "TC004",    # Move import out of type-checking block,
  "COM812",   # Add trailing comma
  "SLF001",   # Private member accessed
  "FIX002",   # Line contains TODO
  "ASYNC109", # Async function with Timeout argument
  ]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D",
  "ANN201",
  "ANN001",
  "PLR2004",  # No Magic Numbers
  "E501",     # Long lines
  "ANN202",   # object not accessed
]
"tests/**/constants.py" = [
  "F401"      # Import not used
]

[tool.ruff.format]
docstring-code-line-length = 90
exclude = ["docs/**"]

[tool.ruff.lint.pydocstyle]
convention = "google"  # https://google.github.io/styleguide/pyguide.html

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
reportOptionalMemberAccess = false
typeCheckingMode = "basic"
reportUnnecessaryTypeIgnoreComment = "warning"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-recording>=0.13,<1",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6.0,<7",
  "pytest-httpx>=0.35.0",
  "pytest-mock>=3.14.0",
  "sphinx>=8.1.3,<9",
  "sphinx-rtd-theme>=3.0.2,<4",
  "pre-commit>=4.1.0",
]
